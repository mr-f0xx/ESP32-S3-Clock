name: Firmware

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core
        run: |
          set -euo pipefail
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Prepare placeholder weather config
        run: |
          cp arduino/08_LVGL_Clock/clock_weather_config.example.h \
             arduino/08_LVGL_Clock/clock_weather_config.h

      - name: Compile sketch
        run: |
          set -euo pipefail
          mkdir -p build/output
          arduino-cli compile \
            --jobs 2 \
            -b "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,PSRAM=opi,CDCOnBoot=cdc" \
            --libraries arduino/libraries \
            --build-path build \
            --output-dir build/output \
            arduino/08_LVGL_Clock

      - name: Install esptool
        run: python -m pip install esptool

      - name: Merge 16 MB flash image
        run: |
          set -euo pipefail
          BOOTLOADER=$(find build/output -maxdepth 1 -name '*.bootloader.bin' -print -quit)
          PARTITIONS=$(find build/output -maxdepth 1 -name '*.partitions.bin' -print -quit)
          APP=$(find build/output -maxdepth 1 -name '*.ino.bin' -print -quit)
          test -n "$BOOTLOADER" && test -n "$PARTITIONS" && test -n "$APP"
          python -m esptool --chip esp32s3 merge_bin \
            -o build/output/LVGL_Clock_16MB.merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0x10000 "$APP"
          test "$(stat -c%s build/output/LVGL_Clock_16MB.merged.bin)" -eq 16777216

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd build/output
          sha256sum *.bin > SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: |
            build/output/*.bin
            build/output/*.elf
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
