<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     fill="none">
  <rect width="512" height="512" rx="96" fill="#0b1220"/>
  <rect x="24" y="24" width="464" height="464" rx="76"
        stroke="#263244" stroke-width="2"/>

  <!--
    The source geometry below is copied from Tabler Icons' outline
    sun-high and cloud icons. Each full-size icon is clipped diagonally:
    cloud keeps its lower-left half and sun-high keeps its upper-right
    half. The divider uses the same 2-unit Tabler stroke.
  -->
  <svg x="80" y="80" width="352" height="352" viewBox="0 0 24 24"
       stroke="#f8fafc"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       shape-rendering="geometricPrecision">
    <defs>
      <clipPath id="upper-right-half" clipPathUnits="userSpaceOnUse">
        <path d="M0 0H24V24Z"/>
      </clipPath>
      <clipPath id="lower-left-half" clipPathUnits="userSpaceOnUse">
        <path d="M0 0V24H24Z"/>
      </clipPath>
    </defs>

    <!-- sun-high: keep only the upper-right half of the full icon. -->
    <g clip-path="url(#upper-right-half)" transform="translate(1 -1)">
      <path d="M14.828 14.828a4 4 0 1 0 -5.656 -5.656a4 4 0 0 0 5.656 5.656"/>
      <path d="M6.343 17.657l-1.414 1.414"/>
      <path d="M6.343 6.343l-1.414 -1.414"/>
      <path d="M17.657 6.343l1.414 -1.414"/>
      <path d="M17.657 17.657l1.414 1.414"/>
      <path d="M4 12h-2"/>
      <path d="M12 4v-2"/>
      <path d="M20 12h2"/>
      <path d="M12 20v2"/>
    </g>

    <!-- cloud: keep only the lower-left half of the full icon. -->
    <g clip-path="url(#lower-left-half)" transform="translate(-1 1)">
      <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878"/>
    </g>

    <!-- Same-weight divider between the two equal diagonal halves. -->
    <path d="M2 2L22 22"/>
  </svg>
</svg>
